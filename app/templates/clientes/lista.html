{% extends "base.html" %}
{% block titulo %}Clientes{% endblock %}
{% block titulo_pagina %}Clientes{% endblock %}

{% block conteudo %}
<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
    <input type="text" id="busca" class="form-control flex-grow-1" style="max-width:320px" placeholder="Buscar por nome, telefone ou CPF...">
    <button class="btn btn-jf" id="btn-novo"><i class="bi bi-person-plus"></i> Novo Cliente</button>
</div>

<div class="table-responsive">
    <table class="jf-tabela">
        <thead><tr><th>Nome</th><th>Telefone</th><th>CPF</th><th>Cidade</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
    </table>
</div>
<p class="text-suave small text-center py-4 d-none" id="estado-vazio">Nenhum cliente encontrado.</p>
<nav class="mt-3" aria-label="Paginação de clientes">
    <ul class="pagination justify-content-center" id="paginacao-clientes"></ul>
</nav>

<!-- Modal Novo/Editar Cliente -->
<div class="modal fade" id="modal-cliente" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="titulo-modal-cliente">Novo Cliente</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="cliente-id">
                <div class="row g-2">
                    <div class="col-md-6"><label>Nome *</label><input class="form-control" id="c-nome"></div>
                    <div class="col-md-3"><label>Telefone</label><input class="form-control" id="c-telefone" placeholder="(00) 00000-0000"></div>
                    <div class="col-md-3"><label>CPF</label><input class="form-control" id="c-cpf" placeholder="000.000.000-00"></div>
                    <div class="col-md-6"><label>Rua</label><input class="form-control" id="c-rua"></div>
                    <div class="col-md-2"><label>Número</label><input class="form-control" id="c-numero"></div>
                    <div class="col-md-4"><label>Complemento</label><input class="form-control" id="c-complemento"></div>
                    <div class="col-md-4"><label>Bairro</label><input class="form-control" id="c-bairro"></div>
                    <div class="col-md-4"><label>Cidade</label><input class="form-control" id="c-cidade"></div>
                    <div class="col-md-2"><label>UF</label><input class="form-control" id="c-estado" maxlength="2"></div>
                    <div class="col-md-2"><label>CEP</label><input class="form-control" id="c-cep" placeholder="00000-000"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-jf-outline" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-jf" id="btn-salvar-cliente">Salvar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let modalCliente;
document.addEventListener('DOMContentLoaded', () => { modalCliente = new bootstrap.Modal(document.getElementById('modal-cliente')); });

let paginaClientesAtual = 1;

async function carregar(pagina = paginaClientesAtual) {
    paginaClientesAtual = pagina;
    const termo = document.getElementById('busca').value.trim();
    const params = new URLSearchParams();
    if (termo) params.set('q', termo);
    params.set('pagina', pagina);

    const resposta = await JF.api('/clientes/api?' + params.toString());
    const clientes = resposta.itens;
    const corpo = document.getElementById('corpo-tabela');
    document.getElementById('estado-vazio').classList.toggle('d-none', clientes.length > 0);
    JF.renderizarPaginacao(document.getElementById('paginacao-clientes'), resposta.pagina, resposta.paginas, carregar);
    corpo.innerHTML = clientes.map(c => `
        <tr>
            <td><a href="/clientes/${c.id}">${c.nome}</a></td>
            <td>${c.telefone || '-'}</td>
            <td>${c.cpf ? formatarCpfExibicao(c.cpf) : '-'}</td>
            <td>${c.cidade || '-'}</td>
            <td class="text-end">
                <button class="btn btn-sm btn-jf-outline" onclick='abrirEdicao(${JSON.stringify(c)})'><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="excluir(${c.id})"><i class="bi bi-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

function formatarCpfExibicao(cpf) {
    return cpf.length === 11 ? `${cpf.slice(0,3)}.${cpf.slice(3,6)}.${cpf.slice(6,9)}-${cpf.slice(9)}` : cpf;
}

function limparForm() {
    document.getElementById('cliente-id').value = '';
    ['nome','telefone','cpf','rua','numero','complemento','bairro','cidade','estado','cep'].forEach(campo => document.getElementById('c-' + campo).value = '');
}

document.getElementById('btn-novo').addEventListener('click', () => {
    limparForm();
    document.getElementById('titulo-modal-cliente').textContent = 'Novo Cliente';
    modalCliente.show();
});

function abrirEdicao(c) {
    document.getElementById('cliente-id').value = c.id;
    document.getElementById('c-nome').value = c.nome || '';
    document.getElementById('c-telefone').value = c.telefone || '';
    document.getElementById('c-cpf').value = c.cpf || '';
    document.getElementById('c-rua').value = c.rua || '';
    document.getElementById('c-numero').value = c.numero || '';
    document.getElementById('c-complemento').value = c.complemento || '';
    document.getElementById('c-bairro').value = c.bairro || '';
    document.getElementById('c-cidade').value = c.cidade || '';
    document.getElementById('c-estado').value = c.estado || '';
    document.getElementById('c-cep').value = c.cep || '';
    document.getElementById('titulo-modal-cliente').textContent = 'Editar Cliente';
    modalCliente.show();
}

document.getElementById('btn-salvar-cliente').addEventListener('click', async () => {
    const id = document.getElementById('cliente-id').value;
    const payload = {};
    ['nome','telefone','cpf','rua','numero','complemento','bairro','cidade','estado','cep'].forEach(campo => payload[campo] = document.getElementById('c-' + campo).value);

    try {
        if (id) {
            await JF.api(`/clientes/api/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
            await JF.api('/clientes/api', { method: 'POST', body: JSON.stringify(payload) });
        }
        JF.toast('Cliente salvo.');
        modalCliente.hide();
        carregar();
    } catch (e) { JF.erro(e); }
});

async function excluir(id) {
    if (!(await JF.confirmar('Excluir este cliente? Se ele já tiver compras registradas, os dados pessoais serão removidos, mas o histórico de vendas é mantido (exigência fiscal).', { perigo: true }))) return;
    try {
        const resultado = await JF.api(`/clientes/api/${id}`, { method: 'DELETE' });
        JF.toast(resultado.anonimizado ? 'Dados pessoais removidos. Histórico de compras preservado.' : 'Cliente excluído.');
        carregar();
    } catch (e) { JF.erro(e); }
}

let buscaTimeout;
document.getElementById('busca').addEventListener('input', () => { clearTimeout(buscaTimeout); buscaTimeout = setTimeout(() => carregar(1), 300); });
carregar();
</script>
{% endblock %}
