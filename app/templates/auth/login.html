<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('jf_tema') || 'escuro');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Entrar · Jennifer Moda Fitness</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top, var(--jf-bg-elevado), var(--jf-bg) 60%); }
        .jf-login-card { width: 100%; max-width: 380px; }
        .jf-logo-central { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--jf-rosa), var(--jf-sombra); }
        .jf-logo-central-fallback { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, var(--jf-rosa-claro), var(--jf-rosa-forte)); display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-weight:800; font-size:2rem; color:#fff; box-shadow: var(--jf-sombra); }
    </style>
</head>
<body>
<div class="jf-login-card px-3">
    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Jennifer Moda Fitness" class="jf-logo-central mb-3"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="jf-logo-central-fallback mx-auto mb-3" style="display:none;">J</div>
        <div class="jf-logo-nome" style="font-size:1.5rem;">Jennifer</div>
        <div class="jf-logo-sub">MODA FITNESS</div>
    </div>

    <div class="jf-card">
        <h2 class="h5 mb-1">Entrar no painel</h2>
        <p class="text-suave small mb-3">Acesso restrito à equipe da loja.</p>

        <div id="alerta-erro" class="alert alert-danger d-none py-2 small"></div>
        <div id="alerta-expirada" class="alert alert-warning d-none py-2 small">Sua sessão expirou. Faça login novamente.</div>

        <form id="form-login">
            <div class="mb-3">
                <label>E-mail</label>
                <input type="email" class="form-control" id="email" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label>Senha</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="senha" required autocomplete="current-password">
                    <button type="button" class="btn btn-jf-outline" id="btn-mostrar-senha" aria-label="Mostrar senha" aria-pressed="false">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-jf w-100" id="btn-entrar">Entrar</button>
        </form>
    </div>
    <p class="text-center text-suave small mt-3">Jennifer Moda Fitness &middot; Painel interno</p>

    <div class="jf-login-tema-switch" role="group" aria-label="Escolher tema">
        <button type="button" class="jf-tema-opcao jf-tema-escuro" data-tema="escuro" title="Tema escuro" aria-label="Tema escuro" aria-pressed="false"></button>
        <button type="button" class="jf-tema-opcao jf-tema-claro" data-tema="claro" title="Tema branco" aria-label="Tema branco" aria-pressed="false"></button>
        <button type="button" class="jf-tema-opcao jf-tema-rosa" data-tema="rosa" title="Tema rosa" aria-label="Tema rosa" aria-pressed="false"></button>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('expirada')) document.getElementById('alerta-expirada').classList.remove('d-none');

    function aplicarTema(tema) {
        document.documentElement.setAttribute('data-theme', tema);
        document.querySelectorAll('.jf-tema-opcao').forEach((btn) => {
            const ativo = btn.dataset.tema === tema;
            btn.classList.toggle('ativo', ativo);
            btn.setAttribute('aria-pressed', String(ativo));
        });
    }
    aplicarTema(localStorage.getItem('jf_tema') || 'escuro');
    document.querySelectorAll('.jf-tema-opcao').forEach((btn) => {
        btn.addEventListener('click', () => {
            localStorage.setItem('jf_tema', btn.dataset.tema);
            aplicarTema(btn.dataset.tema);
        });
    });

    document.getElementById('btn-mostrar-senha').addEventListener('click', function () {
        const campo = document.getElementById('senha');
        const icone = this.querySelector('i');
        const visivel = campo.type === 'text';
        campo.type = visivel ? 'password' : 'text';
        icone.className = visivel ? 'bi bi-eye' : 'bi bi-eye-slash';
        this.setAttribute('aria-label', visivel ? 'Mostrar senha' : 'Ocultar senha');
        this.setAttribute('aria-pressed', String(!visivel));
    });

    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-entrar');
        const alerta = document.getElementById('alerta-erro');
        alerta.classList.add('d-none');
        btn.disabled = true;
        btn.textContent = 'Entrando...';

        try {
            const resp = await fetch('/auth/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value,
                }),
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.erro || 'Não foi possível entrar.');

            localStorage.setItem('jf_token', data.token);
            window.location.href = "{{ proximo|default('') }}" || '/';
        } catch (err) {
            alerta.textContent = err.message;
            alerta.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }
    });
</script>
</body>
</html>
