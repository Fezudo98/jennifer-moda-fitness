{% extends "base.html" %}
{% block titulo %}Vendas Realizadas{% endblock %}
{% block titulo_pagina %}Vendas Realizadas{% endblock %}

{% block conteudo %}
<div class="d-flex flex-wrap gap-2 mb-3">
    <input type="date" id="data-inicio" class="form-control" style="max-width:170px">
    <input type="date" id="data-fim" class="form-control" style="max-width:170px">
    <button class="btn btn-jf-outline" id="btn-filtrar"><i class="bi bi-funnel"></i> Filtrar</button>
</div>

<div class="table-responsive">
    <table class="jf-tabela">
        <thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
    </table>
</div>
<p class="text-suave small text-center py-4 d-none" id="estado-vazio">Nenhuma venda encontrada no período.</p>
{% endblock %}

{% block extra_js %}
<script>
async function carregar() {
    const params = new URLSearchParams();
    const inicio = document.getElementById('data-inicio').value;
    const fim = document.getElementById('data-fim').value;
    if (inicio) params.set('data_inicio', inicio);
    if (fim) params.set('data_fim', fim);

    const vendas = await JF.api('/vendas/api?' + params.toString());
    const corpo = document.getElementById('corpo-tabela');
    document.getElementById('estado-vazio').classList.toggle('d-none', vendas.length > 0);

    corpo.innerHTML = vendas.map(v => `
        <tr>
            <td>${v.numero}</td>
            <td>${JF.data(v.criado_em)}</td>
            <td>${v.cliente_nome}</td>
            <td>${v.vendedor_nome}</td>
            <td class="fw-semibold">${JF.moeda(v.total)}</td>
            <td>${v.reembolsada ? '<span class="badge-jf badge-vermelho">Reembolsada</span>' : '<span class="badge-jf badge-verde">Concluída</span>'}</td>
            <td><a href="/vendas/${v.id}" class="btn btn-sm btn-jf-outline">Ver</a></td>
        </tr>
    `).join('');
}
document.getElementById('btn-filtrar').addEventListener('click', carregar);
carregar();
</script>
{% endblock %}
