{% extends "base.html" %}
{% block titulo %}Detalhe da Venda{% endblock %}
{% block titulo_pagina %}Detalhe da Venda{% endblock %}

{% block conteudo %}
<a href="{{ url_for('vendas.pagina_lista') }}" class="text-suave small"><i class="bi bi-arrow-left"></i> Voltar</a>

<div id="conteudo-venda" class="mt-3"></div>
{% endblock %}

{% block extra_js %}
<script>
const VENDA_ID = {{ venda_id }};

async function carregar() {
    const v = await JF.api(`/vendas/api/${VENDA_ID}`);
    const container = document.getElementById('conteudo-venda');

    container.innerHTML = `
        <div class="jf-card mb-3">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
                <div>
                    <h2 class="h5 mb-1">Venda ${v.numero} ${v.reembolsada ? '<span class="badge-jf badge-vermelho ms-2">Reembolsada</span>' : ''}</h2>
                    <div class="text-suave small">${JF.data(v.criado_em)} · Vendedor(a): ${v.vendedor_nome}</div>
                    <div class="text-suave small">Cliente: ${v.cliente_nome}</div>
                </div>
                <div class="d-flex gap-2">
                    <a href="/vendas/${v.id}/recibo" target="_blank" class="btn btn-jf-outline"><i class="bi bi-printer"></i> Recibo</a>
                    <a href="/vendas/${v.id}/comprovante" class="btn btn-jf-outline"><i class="bi bi-file-earmark-pdf"></i> Comprovante (PDF)</a>
                    ${(!v.reembolsada && window.JF_PAPEL === 'admin') ? `<button class="btn btn-outline-danger" onclick="reembolsar()"><i class="bi bi-arrow-counterclockwise"></i> Reembolsar</button>` : ''}
                </div>
            </div>
        </div>

        <div class="jf-card mb-3">
            <h3 class="h6 mb-3">Itens</h3>
            <div class="table-responsive">
                <table class="jf-tabela">
                    <thead><tr><th>Produto</th><th>Cor/Tam.</th><th>Qtd.</th><th>Preço Unit.</th><th>Subtotal</th></tr></thead>
                    <tbody>
                        ${v.itens.map(i => `<tr><td>${i.produto_nome}</td><td>${i.cor}/${i.tamanho}</td><td>${i.quantidade}</td><td>${JF.moeda(i.preco_venda_unit)}</td><td>${JF.moeda(i.subtotal)}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="jf-card">
                    <h3 class="h6 mb-3">Pagamentos</h3>
                    ${v.pagamentos.map(p => `
                        <div class="d-flex justify-content-between align-items-center small mb-2 pb-2 border-bottom" style="border-color: var(--jf-borda) !important">
                            <div>
                                <div>${rotuloForma(p.forma)}${p.parcelas ? ' (' + p.parcelas + 'x)' : ''}</div>
                                <div class="text-suave">${JF.moeda(p.valor)}</div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                ${p.tem_comprovante ? `
                                    <a href="/vendas/api/pagamentos/${p.id}/comprovante" target="_blank" class="btn btn-sm btn-jf-outline" title="Ver comprovante"><i class="bi bi-paperclip"></i> Ver</a>
                                    <button class="btn btn-sm text-danger" title="Remover comprovante" onclick="removerComprovantePagamento(${p.id})"><i class="bi bi-trash"></i></button>
                                ` : `
                                    <button class="btn btn-sm btn-jf-outline" onclick="document.getElementById('input-comprovante-${p.id}').click()"><i class="bi bi-paperclip"></i> Anexar</button>
                                    <input type="file" id="input-comprovante-${p.id}" class="d-none" accept="image/*,.pdf" onchange="anexarComprovantePagamento(${p.id}, this.files[0])">
                                `}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
            <div class="col-md-6">
                <div class="jf-card">
                    <h3 class="h6 mb-3">Resumo</h3>
                    <div class="d-flex justify-content-between small mb-1"><span class="text-suave">Subtotal</span><span>${JF.moeda(v.subtotal)}</span></div>
                    <div class="d-flex justify-content-between small mb-1"><span class="text-suave">Desconto ${v.cupom_codigo ? '(' + v.cupom_codigo + ')' : ''}</span><span>- ${JF.moeda(v.desconto)}</span></div>
                    <div class="d-flex justify-content-between small mb-1"><span class="text-suave">Entrega (${v.entrega_tipo === 'motoboy' ? 'Motoboy' : 'Retirada'})</span><span>${JF.moeda(v.entrega_taxa)}</span></div>
                    <hr style="border-color: var(--jf-borda)">
                    <div class="d-flex justify-content-between fw-bold fs-5"><span>Total</span><span class="text-rosa">${JF.moeda(v.total)}</span></div>
                    ${v.entrega_tipo === 'motoboy' ? `<div class="mt-2 small text-suave">Endereço: ${v.entrega_endereco}<br>Status: ${v.entrega_status}</div>` : ''}
                </div>
            </div>
        </div>
    `;
}

function rotuloForma(forma) {
    return { dinheiro: 'Dinheiro', pix: 'PIX', cartao_credito: 'Cartão de Crédito', cartao_debito: 'Cartão de Débito' }[forma] || forma;
}

async function anexarComprovantePagamento(pagamentoId, arquivo) {
    if (!arquivo) return;
    const formData = new FormData();
    formData.append('comprovante', arquivo);
    try {
        await JF.api(`/vendas/api/pagamentos/${pagamentoId}/comprovante`, { method: 'POST', body: formData });
        JF.toast('Comprovante anexado.');
        carregar();
    } catch (e) { JF.erro(e); }
}

async function removerComprovantePagamento(pagamentoId) {
    if (!(await JF.confirmar('Remover este comprovante?', { perigo: true }))) return;
    try {
        await JF.api(`/vendas/api/pagamentos/${pagamentoId}/comprovante`, { method: 'DELETE' });
        JF.toast('Comprovante removido.');
        carregar();
    } catch (e) { JF.erro(e); }
}

async function reembolsar() {
    if (!(await JF.confirmar('Confirmar reembolso desta venda? O estoque será devolvido e o valor sairá do caixa.', { perigo: true, textoConfirmar: 'Reembolsar' }))) return;
    try {
        await JF.api(`/vendas/api/${VENDA_ID}/reembolsar`, { method: 'POST' });
        JF.toast('Venda reembolsada.');
        carregar();
    } catch (e) { JF.erro(e); }
}

window.JF_PAPEL = "{{ usuario_logado_papel }}";
carregar();
</script>
{% endblock %}
