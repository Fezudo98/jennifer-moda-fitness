{% extends "base.html" %}
{% block titulo %}Caixa{% endblock %}
{% block titulo_pagina %}Gerenciar Caixa{% endblock %}

{% block conteudo %}
<div class="jf-kpi destaque mb-3" style="max-width:320px">
    <div class="rotulo">Saldo Atual em Caixa</div>
    <div class="valor" id="saldo-atual">R$ 0,00</div>
</div>

<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
    <div class="d-flex flex-wrap gap-2">
        <input type="date" id="data-inicio" class="form-control" style="max-width:160px">
        <input type="date" id="data-fim" class="form-control" style="max-width:160px">
        <button class="btn btn-jf-outline" id="btn-filtrar"><i class="bi bi-funnel"></i></button>
    </div>
    <button class="btn btn-jf" id="btn-nova-mov"><i class="bi bi-plus-lg"></i> Novo Lançamento</button>
</div>

<div class="table-responsive">
    <table class="jf-tabela">
        <thead><tr><th>Data</th><th>Tipo</th><th>Motivo</th><th>Valor</th><th>Observação</th><th>Usuário</th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
    </table>
</div>

<div class="modal fade" id="modal-mov" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Novo Lançamento Manual</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label>Tipo</label>
                        <select class="form-select" id="m-tipo">
                            <option value="entrada">Entrada</option>
                            <option value="saida">Saída</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label>Motivo</label>
                        <select class="form-select" id="m-motivo">
                            <option value="ajuste">Ajuste</option>
                            <option value="sangria">Sangria</option>
                            <option value="despesa">Despesa</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3"><label>Valor (R$)</label><input class="form-control" id="m-valor"></div>
                <div class="mb-0"><label>Observação (obrigatória)</label><textarea class="form-control" id="m-observacao" rows="2"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-jf-outline" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-jf" id="btn-salvar-mov">Salvar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let modal;
document.addEventListener('DOMContentLoaded', () => { modal = new bootstrap.Modal(document.getElementById('modal-mov')); });

function rotuloMotivo(m) {
    return { venda: 'Venda', troco: 'Troco', reembolso: 'Reembolso', sangria: 'Sangria', despesa: 'Despesa', ajuste: 'Ajuste manual' }[m] || m;
}

async function carregar() {
    const params = new URLSearchParams();
    const inicio = document.getElementById('data-inicio').value;
    const fim = document.getElementById('data-fim').value;
    if (inicio) params.set('data_inicio', inicio);
    if (fim) params.set('data_fim', fim);

    const data = await JF.api('/caixa/api?' + params.toString());
    document.getElementById('saldo-atual').textContent = JF.moeda(data.saldo);
    document.getElementById('corpo-tabela').innerHTML = data.movimentacoes.map(m => `
        <tr>
            <td>${JF.data(m.criado_em)}</td>
            <td>${m.tipo === 'entrada' ? '<span class="badge-jf badge-verde">Entrada</span>' : '<span class="badge-jf badge-vermelho">Saída</span>'}</td>
            <td>${rotuloMotivo(m.motivo)}</td>
            <td class="fw-semibold">${JF.moeda(m.valor)}</td>
            <td class="small text-suave">${m.observacao || '-'}</td>
            <td class="small">${m.usuario_nome || '-'}</td>
        </tr>
    `).join('');
}

document.getElementById('btn-filtrar').addEventListener('click', carregar);
document.getElementById('btn-nova-mov').addEventListener('click', () => {
    document.getElementById('m-tipo').value = 'entrada';
    document.getElementById('m-motivo').value = 'ajuste';
    document.getElementById('m-valor').value = '';
    document.getElementById('m-observacao').value = '';
    modal.show();
});

document.getElementById('btn-salvar-mov').addEventListener('click', async () => {
    const payload = {
        tipo: document.getElementById('m-tipo').value,
        motivo: document.getElementById('m-motivo').value,
        valor: document.getElementById('m-valor').value,
        observacao: document.getElementById('m-observacao').value,
    };
    try {
        await JF.api('/caixa/api/movimentacao', { method: 'POST', body: JSON.stringify(payload) });
        JF.toast('Lançamento registrado.');
        modal.hide();
        carregar();
    } catch (e) { JF.erro(e); }
});

carregar();
</script>
{% endblock %}
