{% extends "base.html" %}
{% block titulo %}Logs de Atividade{% endblock %}
{% block titulo_pagina %}Logs de Atividade{% endblock %}

{% block conteudo %}
<div class="table-responsive">
    <table class="jf-tabela">
        <thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr></thead>
        <tbody id="corpo-tabela"></tbody>
    </table>
</div>
<nav class="mt-3">
    <ul class="pagination justify-content-center" id="paginacao"></ul>
</nav>
{% endblock %}

{% block extra_js %}
<script>
let paginaAtual = 1;

const ROTULOS_ACAO = {
    login: 'Login', logout: 'Logout', login_falhou: 'Tentativa de login falhou', login_bloqueado: 'Login de usuário desativado',
    venda_registrada: 'Venda registrada', venda_reembolsada: 'Venda reembolsada',
    produto_criado: 'Produto criado', produto_editado: 'Produto editado', produto_excluido: 'Produto excluído',
    produtos_excluidos_em_massa: 'Exclusão em massa', estoque_zerado_em_massa: 'Estoque zerado em massa',
    variacao_criada: 'Variação criada', variacao_reativada: 'Variação reativada', variacao_editada: 'Variação editada',
    variacao_excluida: 'Variação excluída', estoque_ajustado: 'Estoque ajustado', categoria_criada: 'Categoria criada',
    categoria_renomeada: 'Categoria renomeada', categoria_excluida: 'Categoria excluída', imagens_adicionadas: 'Imagens adicionadas',
    cliente_criado: 'Cliente criado', cliente_editado: 'Cliente editado', cliente_excluido: 'Cliente excluído',
    cliente_anonimizado: 'Cliente anonimizado (LGPD)',
    cupom_criado: 'Cupom criado', cupom_editado: 'Cupom editado', cupom_status_alterado: 'Status de cupom alterado',
    caixa_ajuste_manual: 'Ajuste manual de caixa', usuario_criado: 'Usuário criado', usuario_editado: 'Usuário editado',
    usuario_status_alterado: 'Status de usuário alterado', usuario_senha_redefinida: 'Senha redefinida',
    entrega_status_atualizado: 'Status de entrega atualizado',
    comprovante_pagamento_anexado: 'Comprovante anexado', comprovante_pagamento_removido: 'Comprovante removido',
};

async function carregar(pagina = 1) {
    paginaAtual = pagina;
    const data = await JF.api('/logs/api?pagina=' + pagina);
    document.getElementById('corpo-tabela').innerHTML = data.logs.map(l => `
        <tr>
            <td class="small">${JF.data(l.criado_em)}</td>
            <td class="small">${l.usuario_nome}</td>
            <td><span class="badge-jf badge-rosa">${ROTULOS_ACAO[l.acao] || l.acao}</span></td>
            <td class="small text-suave">${l.detalhes || '-'}</td>
        </tr>
    `).join('');

    const paginacao = document.getElementById('paginacao');
    paginacao.innerHTML = '';
    for (let p = 1; p <= data.paginas; p++) {
        paginacao.innerHTML += `<li class="page-item ${p === paginaAtual ? 'active' : ''}"><a class="page-link" href="#" onclick="carregar(${p}); return false;">${p}</a></li>`;
    }
}
carregar();
</script>
{% endblock %}
